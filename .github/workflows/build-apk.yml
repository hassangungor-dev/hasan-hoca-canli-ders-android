name: Android APK Oluştur

on:
  workflow_dispatch:
  push:
    branches: [ "main", "ana", "native-tablet-v2" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: APK üret
        run: gradle :app:assembleDebug --stacktrace

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk Hasan-Hoca-Canli-Ders-v1.0.7.apk

      - name: APK dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: Hasan-Hoca-Canli-Ders-APK
          path: Hasan-Hoca-Canli-Ders-v1.0.7.apk
          retention-days: 90

      - name: Herkese açık indirme bağlantısını yayınla
        if: github.ref == 'refs/heads/native-tablet-v2' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.7 >/dev/null 2>&1 || gh release create v1.0.7 --title "Hasan Hoca Canlı Ders v1.0.7" --notes "Zoom benzeri sade toplantı ekranı; mikrofon, ekran paylaşımı, kayıt ve dersi bitirme düğmeleri tek alt menüde."
          gh release upload v1.0.7 Hasan-Hoca-Canli-Ders-v1.0.7.apk --clobber
