name: Android APK Oluştur

on:
  workflow_dispatch:
  push:
    branches: [ "main", "ana" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: APK üret
        run: gradle :app:assembleDebug --stacktrace

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk Hasan-Hoca-Canli-Ders.apk

      - name: APK dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: Hasan-Hoca-Canli-Ders-APK
          path: Hasan-Hoca-Canli-Ders.apk
          retention-days: 90

      - name: Herkese açık indirme bağlantısını yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.3 >/dev/null 2>&1 || gh release create v1.0.3 --title "Hasan Hoca Canlı Ders v1.0.3" --notes "Google ile toplantı sahibi doğrulamasından sonra toplantıya otomatik dönüş eklendi. Ekran paylaşımı düğmesi toplantı ekranında görünür." --latest
          gh release upload v1.0.3 Hasan-Hoca-Canli-Ders.apk --clobber
